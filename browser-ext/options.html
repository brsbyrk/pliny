<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #1e1e2e;
      color: #cdd6f4;
      min-width: 400px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #45475a;
      border-radius: 4px;
      background: #313244;
      color: #cdd6f4;
      box-sizing: border-box;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #7c3aed;
    }
    .btn-save-options {
      margin-top: 14px;
      padding: 8px 20px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-save-options:hover {
      background: #6d28d9;
    }
    .status {
      margin-top: 8px;
      font-size: 13px;
    }
    .status.success { color: #a6e3a1; }
    .status.error   { color: #f38ba8; }
  </style>
</head>
<body>
  <label for="server-url">Pliny server URL</label>
  <input type="text" id="server-url" placeholder="http://192.168.1.105:3131" />
  <button class="btn-save-options" id="btn-save-options">Save</button>
  <div class="status" id="status"></div>
  <script src="options.js"></script>
</body>
</html>
