<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      width: 320px;
      background: #1e1e2e;
      color: #cdd6f4;
    }
    h2 {
      margin: 0 0 4px 0;
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
      color: #f5f5f5;
    }
    .url {
      font-size: 12px;
      color: #6c7086;
      word-break: break-all;
      margin-bottom: 12px;
    }
    .btn-save {
      width: 100%;
      padding: 10px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-save:hover {
      background: #6d28d9;
    }
    .btn-save:disabled {
      background: #45475a;
      cursor: not-allowed;
    }
    .status {
      font-size: 13px;
      margin-top: 8px;
      text-align: center;
    }
    .status.success { color: #a6e3a1; }
    .status.error   { color: #f38ba8; }
  </style>
</head>
<body>
  <h2 id="page-title">Loading...</h2>
  <div class="url" id="page-url"></div>
  <button class="btn-save" id="btn-save">Save to Pliny</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
