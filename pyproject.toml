[project]
name = "pliny"
version = "0.2.0"
description = "Personal AI agent — SQLite-indexed knowledge from your links"
requires-python = ">=3.11"
dependencies = [
    "sqlite-vec>=0.1.0",
    "sentence-transformers>=3.0.0",
    "readability-lxml>=0.8.4.1",
    "markdownify>=1.2.2",
    "beautifulsoup4>=4.14.3",
    "requests>=2.33.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "feedparser>=6.0",
    "yt-dlp>=2024.0",
    "faster-whisper>=1.0.0",
    "scikit-learn>=1.4.0",
    "optimum>=2.1.0",
    "optimum-onnx>=0.1.0",
    "onnx>=1.21.0",
    "torch>=2.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[project.scripts]
pliny-query = "query:main"
pliny-ingest = "cli.ingest_cli:main"
pliny-server = "dashboard.server:main"
pliny-auto-tag = "cli.auto_tag:main"
pliny-digest = "cron.digest:main"
pliny-rss = "ingest.rss:main"

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
